      font-size: 0.95rem;
      line-height: 1.75;
      color: #3A4545;

    }
    ul, ol {
      padding-left: 1.4rem;
      margin-bottom: 1rem;
    }
    li {

      line-height: 1.75;

      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      color: #3A4545;
    }
    a { color: var(--sage); }
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }
    strong { font-weight: 500; color: var(--charcoal); }
    footer {
      padding: 1.75rem 2.5rem;

      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;

    .footer-links a:hover { color: var(--charcoal); }

      header, footer { padding: 1.5rem; }
